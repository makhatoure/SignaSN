name: citizen_report_sn
description: "Plateforme Citoyenne de Signalement au Sénégal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Backend & Auth (Supabase)
  supabase_flutter: ^2.3.0
  
  # Cartographie (OpenStreetMap - 100% Gratuit)
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  
  # Géolocalisation GPS
  geolocator: ^10.1.0
  
  # Capture & Compression Photo (Optimisation Data Sénégal)
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  
  # Notes Vocales
  record: ^5.0.0
  audioplayers: ^5.2.1
  
  # UI & Icônes
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
